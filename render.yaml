# Render Blueprint: deploys this repo as a static site.
# Render dashboard -> New -> Blueprint -> pick this repo -> Apply.
services:
  - type: web
    runtime: static
    name: harish-portfolio
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      # Vite gives built assets hashed names, so they can be cached for a year
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
